<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход — SkinVault</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div class="auth-box">
  <a href="index.html" class="logo center-logo">
    <span class="logo-icon">◆</span> SKIN<span class="accent">VAULT</span>
  </a>
  <h2>С возвращением 👋</h2>
  <p class="muted">Войди, чтобы открывать кейсы и покупать скины</p>

  <form id="loginForm" class="auth-form">
    <label>Email
      <input type="email" name="email" required placeholder="you@example.com">
    </label>
    <label>Пароль
      <input type="password" name="password" required placeholder="••••••••">
    </label>
    <button class="btn btn-primary btn-lg full" type="submit">Войти</button>
  </form>

  <p class="auth-switch">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
</div>
<script src="js/auth.js"></script>
</body>
</html>
